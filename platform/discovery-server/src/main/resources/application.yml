server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  instance:
    hostname: localhost
  client:
    # The registry itself is not a client.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Dev: drop stopped instances quickly instead of protecting the registry.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true   # Grafana's p95 latency panel (D17)
  tracing:
    sampling:
      probability: 1.0   # every request is traced (a demo; Zipkin at localhost:9411 by default, D17)
  server:
    port: 18761   # 10000 + server port: actuator only here, never published or routed (D17)
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-components: always   # names and status for the admin health page (D15); details stay hidden
      probes:
        enabled: true   # /actuator/health/liveness and /readiness for the compose healthchecks
