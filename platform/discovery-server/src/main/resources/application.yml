server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  instance:
    hostname: localhost
  client:
    # The registry itself is not a client.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Dev: drop stopped instances quickly instead of protecting the registry.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always   # names and status for the admin health page (D15); details stay hidden
