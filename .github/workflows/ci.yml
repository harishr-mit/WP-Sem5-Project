# Build and test every module on each push and pull request.
# Testcontainers tests use the runner's Docker; the JDK comes from setup-java (not scripts/setup-jdk.ps1).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Formatting (Spotless), enforcer, compile, unit + Testcontainers tests.
      - name: Verify
        run: ./mvnw -B -ntp verify
