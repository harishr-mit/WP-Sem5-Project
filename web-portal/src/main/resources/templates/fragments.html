<!DOCTYPE html>
<!-- Shared pieces of every page. P3 slice: plain on purpose (docs/DECISIONS.md D9); P6 restyles it. -->
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · MITPass'">MITPass</title>
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body>

<header th:fragment="header" class="top">
    <a class="brand" th:href="@{/events}">MITPASS</a>
    <nav>
        <a th:href="@{/events}">Events</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/my/registrations}">My registrations</a>
        <a sec:authorize="hasAnyRole('ORGANIZER', 'ADMIN')" th:href="@{/organizer/events}">My events</a>
    </nav>
    <div class="who">
        <th:block th:if="${currentUser != null}">
            <span th:text="${currentUser.displayName()}">Priya Raman</span>
            <form th:action="@{/logout}" method="post" class="inline">
                <button type="submit" class="link">Log out</button>
            </form>
        </th:block>
        <th:block th:if="${currentUser == null}">
            <a th:href="@{/login}">Log in</a>
            <a th:href="@{/signup}">Sign up</a>
        </th:block>
    </div>
</header>

<div th:fragment="flash">
    <p class="flash ok" th:if="${message}" th:text="${message}">Saved.</p>
    <p class="flash err" th:if="${error}" th:text="${error}">Something went wrong.</p>
</div>

</body>
</html>
