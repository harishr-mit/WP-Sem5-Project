<!DOCTYPE html>
<!--/* Manual entry without JavaScript, step two: compare the name with the person, then confirm (PRG back to /scan). */-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: bare(title=#{scan.isThis}, content=~{::main})}">
<main id="main" class="scanner">
    <div class="scanner__top"><a th:href="@{/scan}" th:aria-label="#{common.back}">←</a></div>
    <div class="card" style="margin:1rem">
        <p class="eyebrow" th:text="#{scan.isThis}">Is this the person?</p>
        <p class="stat__value mt-0" style="font-size:2rem" th:text="${lookup.holderName()}">Priya Raman</p>
        <p class="pass-number" th:text="${lookup.passNumber()}">TECHFEST26-000042-7</p>
        <p class="row"><span th:replace="~{layout :: badge(${lookup.passStatus()})}"></span>
            <span th:replace="~{layout :: badge(${lookup.presence()})}"></span>
            <span class="hint" th:if="${lookup.sessionTitle() != null}" th:text="${lookup.sessionTitle()}">Day 1</span></p>
        <form th:action="@{/scan/confirm}" method="post" class="actions">
            <input type="hidden" name="passNumber" th:value="${lookup.passNumber()}">
            <input type="hidden" name="gateId" th:value="${gateId}">
            <input type="hidden" name="mode" th:value="${mode}">
            <button type="submit" th:text="${mode == 'OUT'} ? #{scan.confirmOut} : #{scan.confirmIn}">Confirm check-in</button>
            <a class="btn btn--ghost" th:href="@{/scan}" th:text="#{common.cancel}">Cancel</a>
        </form>
    </div>
</main>
</html>
