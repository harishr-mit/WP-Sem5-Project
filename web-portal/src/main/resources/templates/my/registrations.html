<!DOCTYPE html>
<!--/* My registrations. While anything is waitlisted, #registrations asks again every few seconds (HTMX); the server
     answers 286 to stop once nothing is waiting. Also holds the shared cancel button + confirmation dialog. */-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(title=#{nav.myRegistrations}, content=~{::main})}">
<main id="main" class="page page--medium">
    <div class="pagehead">
        <h1 th:text="#{nav.myRegistrations}">My registrations</h1>
    </div>
    <div th:replace="~{layout :: flash}"></div>

    <section id="registrations" th:fragment="list" aria-live="polite"
             th:attr="hx-get=${waiting} ? @{/my/registrations},hx-trigger=${waiting} ? |every ${waitlistRefreshSeconds}s|"
             hx-swap="outerHTML">
        <p class="hint" th:if="${waiting}"><span class="spinner" aria-hidden="true"></span>
            <span th:text="#{registrations.watching}">Waitlist places update by themselves.</span></p>
        <div class="table-wrap" th:if="${!registrations.isEmpty()}">
            <table class="stacked">
                <thead><tr>
                    <th th:text="#{registrations.event}">Event</th>
                    <th th:text="#{registrations.starts}">Starts</th>
                    <th th:text="#{registrations.status}">Status</th>
                    <th><span class="visually-hidden" th:text="#{registrations.actions}">Actions</span></th>
                </tr></thead>
                <tbody>
                <tr th:each="r : ${registrations}">
                    <td th:data-label="#{registrations.event}"><a th:href="@{/events/{id}(id=${r.eventId()})}" th:text="${r.eventTitle()}">HackNight 26</a>
                        <br><small class="mono" th:text="${r.eventCode()}">TECHFEST26</small></td>
                    <td th:data-label="#{registrations.starts}" th:text="${@fmt.when(r.eventStartsAt())}">Sat 17 Oct 2026, 09:00</td>
                    <td th:data-label="#{registrations.status}">
                        <span class="badge" th:classappend="${@fmt.badgeClass(r.status())}"
                              th:text="${@fmt.status(r.status(), r.waitlistPosition())}">Waitlisted #1</span>
                        <br th:if="${r.viaPromotion()}"><small th:if="${r.viaPromotion()}" th:text="#{registrations.promoted}">moved up from the waitlist</small>
                    </td>
                    <td data-label="" class="right">
                        <div class="actions" style="justify-content:flex-end">
                            <a th:if="${r.status() == 'CONFIRMED'}" class="btn btn--small" th:href="@{/my/passes}"
                               th:text="#{nav.myPasses}">My passes</a>
                            <th:block th:if="${r.isActive()}">
                                <th:block th:replace="~{:: cancelForm(${r}, '/my/registrations')}"></th:block>
                            </th:block>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="empty card" th:if="${registrations.isEmpty()}">
            <strong th:text="#{registrations.empty}">Nothing yet</strong>
            <a class="btn mt-4" th:href="@{/events}" th:text="#{registrations.browse}">Browse events</a>
        </div>
    </section>
</main>

<!--/* Cancel a registration: the button posts straight away without JavaScript; with it, a dialog asks first. */-->
<th:block th:fragment="cancelForm(r, back)">
    <form th:action="@{/my/registrations/{id}/cancel(id=${r.id()})}" method="post" class="inline">
        <input type="hidden" name="back" th:value="${back}">
        <button type="submit" class="btn--secondary btn--small" th:attr="data-open-dialog=|cancel-${r.id()}|"
                th:text="${r.status() == 'CONFIRMED'} ? #{cancel.button} : #{cancel.leaveWaitlist}">Cancel</button>
    </form>
    <dialog class="confirm" th:id="|cancel-${r.id()}|" th:aria-labelledby="|cancel-${r.id()}-title|">
        <form th:action="@{/my/registrations/{id}/cancel(id=${r.id()})}" method="post">
            <input type="hidden" name="back" th:value="${back}">
            <div class="confirm__body">
                <h2 th:id="|cancel-${r.id()}-title|" th:text="${r.status() == 'CONFIRMED'} ? #{cancel.title} : #{cancel.leaveWaitlist}">Cancel your registration?</h2>
                <p class="mb-0" th:text="${r.status() == 'CONFIRMED'} ? #{cancel.text(${r.eventTitle()})} : #{cancel.waitlistText(${r.eventTitle()})}">Your seat goes to the next person.</p>
            </div>
            <div class="confirm__foot">
                <button type="button" class="btn--ghost" data-close-dialog th:text="#{cancel.keep}">Keep it</button>
                <button type="submit" class="btn--danger" th:text="${r.status() == 'CONFIRMED'} ? #{cancel.confirm} : #{cancel.leaveWaitlist}">Cancel registration</button>
            </div>
        </form>
    </dialog>
</th:block>
</html>
