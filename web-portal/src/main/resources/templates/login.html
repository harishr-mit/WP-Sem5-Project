<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Log in')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="narrow">
    <h1>Log in</h1>

    <p class="flash ok" th:if="${param.signedUp}">
        Account created for <strong th:text="${signedUpEmail}">you</strong>. Open the verification link in the email
        we sent, then log in.
        <th:block th:if="${mailpitUrl != null and !#strings.isEmpty(mailpitUrl)}">
            (Dev inbox: <a th:href="${mailpitUrl}" th:text="${mailpitUrl}" target="_blank">Mailpit</a>)
        </th:block>
    </p>
    <p class="flash ok" th:if="${param.loggedOut}">You are logged out.</p>
    <p class="flash err" th:if="${param.expired}">Your session has expired. Please log in again.</p>
    <p class="flash err" th:if="${param.error}"
       th:text="${loginError != null ? loginError : 'Email or password is wrong.'}">Email or password is wrong.</p>

    <form th:action="@{/login}" method="post" class="stack">
        <label>College email <input type="email" name="email" required autofocus></label>
        <label>Password <input type="password" name="password" required></label>
        <button type="submit">Log in</button>
    </form>
    <p>No account yet? <a th:href="@{/signup}">Create one</a>.</p>
</main>
</body>
</html>
