server:
  port: 8083
  # Honour X-Forwarded-* from the gateway (Location headers, springdoc server URLs).
  forward-headers-strategy: framework

spring:
  application:
    name: pass-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/pass_db
    username: ${DB_USER:pass_svc}
    password: ${DB_PASSWORD:pass_svc}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        max-page-size: 100
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:mitpass}
    password: ${RABBITMQ_PASSWORD:mitpass}
    publisher-confirm-type: simple   # the outbox relay waits for confirms (D11)
    listener:
      simple:
        # One thread: messages from the event-service relay are handled in publish order (D13).
        concurrency: 1
        max-concurrency: 1
        prefetch: 20
        default-requeue-rejected: false   # after the retries, a failing message goes to the DLQ
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 4

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always   # names and status for the admin health page (D15); details stay hidden

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

mitpass:
  security:
    public-paths:
      - GET /.well-known/pass-jwks.json
  clients:
    event-service: http://event-service    # Eureka service id (Spring Cloud LoadBalancer)
  messaging:
    exchange: mitpass.events
    relay:
      poll-interval: 500ms
      batch-size: 100
      retention: 7d
    consumer:
      retention: 30d
      dead-letter-exchange: mitpass.events.dlx   # minimal DLQ (D13); P7 completes the handling
  passes:
    issuer: mitpass-pass
    # Encrypts pass signing keys at rest. Dev default only: set MITPASS_KEY_SECRET anywhere real.
    key-secret: ${MITPASS_KEY_SECRET:dev-only-change-me}
    live-token-ttl: 45s
    live-refresh-interval: 30s           # returned as refreshAfterSeconds
    static-valid-after-end: 2h           # static (PDF) token: valid until the event ends plus this
    code-unlock-before-start: 150m       # live code / ACTIVE: 2 h before doors open (doors open 30 min early)
    expire-after-end: 2h
    event-cache-ttl: 60s
    time-zone: Asia/Kolkata
    scheduler:
      enabled: true
      interval: 30s
    # RL7 / D14: re-read status and times of events with valid passes from event-service (catches lost messages)
    reconcile:
      interval: 5m
      initial-delay: 30s
    qr:
      size: 400
      margin: 2
      logo: ""                           # empty = a drawn MIT badge; or a PNG resource such as classpath:logo.png
      logo-ratio: 0.2
      default-color: "#7A1F2B"

logging:
  pattern:
    level: "%5p [%X{correlationId:-}] [%X{userId:-}]"
