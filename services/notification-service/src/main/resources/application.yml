server:
  port: 8085
  # Honour X-Forwarded-* from the gateway (springdoc server URLs).
  forward-headers-strategy: framework

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/notification_db
    username: ${DB_USER:notification_svc}
    password: ${DB_PASSWORD:notification_svc}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}          # Mailpit (infra/docker-compose.yml); its UI is http://localhost:8025
    properties:
      mail.smtp.connectiontimeout: 5000   # an email is sent inside a transaction: don't hold it long
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:mitpass}
    password: ${RABBITMQ_PASSWORD:mitpass}
    listener:
      simple:
        observation-enabled: true   # continues the trace from the message's traceparent (D17)
        concurrency: 1
        max-concurrency: 1
        prefetch: 20
        default-requeue-rejected: false   # after the retries, a failing message goes to the DLQ (D13)
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 4

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true   # Grafana's p95 latency panel (D17)
  tracing:
    sampling:
      probability: 1.0   # every request is traced (a demo; Zipkin at localhost:9411 by default, D17)
  server:
    port: 18085   # 10000 + server port: actuator only here, never published or routed (D17)
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-components: always   # names and status for the admin health page (D15); details stay hidden
      probes:
        enabled: true   # /actuator/health/liveness and /readiness for the compose healthchecks
      status:
        order: DOWN,OUT_OF_SERVICE,WARNING,UP,UNKNOWN   # WARNING: a dead-letter queue holds messages (D13, P7)

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

mitpass:
  security:
    public-paths:
      - GET /api/notifications/events/{id}/calendar.ics
  clients:
    # Eureka service ids (Spring Cloud LoadBalancer)
    event-service: http://event-service
    pass-service: http://pass-service
    auth-service: http://auth-service
  messaging:
    exchange: mitpass.events
    relay:
      enabled: false                             # publishes nothing, so no outbox table
    consumer:
      retention: 30d
      dead-letter-exchange: mitpass.events.dlx
    tap-queue:
      enabled: false                             # event-service declares it
  notifications:
    from: "MITPass <no-reply@mitpass.local>"
    portal-url: ${MITPASS_PORTAL_URL:http://localhost:8090}   # links in emails; use the LAN address for phones
    time-zone: Asia/Kolkata
    catalog-cache-ttl: 60s
    reminders:
      enabled: true
      interval: 1m
      lock-at-most-for: 4m
      offsets: 24h,1h
      window: 5m
    # This service's identity for SERVICE reads (D7). Dev secret only: set the variable anywhere real.
    service-client:
      id: notification-service
      secret: ${MITPASS_SERVICE_SECRET_NOTIFICATION:dev-only-notification-secret}

logging:
  pattern:
    level: "%5p [%X{correlationId:-}] [%X{messageId:-}]"
