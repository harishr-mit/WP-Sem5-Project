<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/layout :: mail(~{::body})}">
<body>
<p style="margin:0 0 12px;">You're in. Your pass is ready.</p>
<p style="margin:0 0 12px;">Pass number <strong style="font-family:Consolas,monospace;" th:text="${passNumber}">TECHFEST26-000042-7</strong></p>
<p th:if="${hasQr}" style="margin:0 0 12px;text-align:center;">
    <img src="cid:qr" alt="Your pass QR code" width="220" height="220" style="width:220px;height:220px;">
</p>
<p style="margin:0 0 12px;" th:text="${hasQr} ? 'Show this code at the gate, or the live code in MITPass.' : 'This event uses a live code: open your pass in MITPass at the gate.'">Show this code at the gate.</p>
<p style="margin:0 0 12px;"><a th:href="${passUrl}" href="#" style="display:inline-block;background:#7A1F3D;color:#FFFFFF;padding:10px 18px;border-radius:8px;text-decoration:none;">Open my pass</a></p>
<p style="margin:0;font-size:13px;color:#4A5872;">The attached invite adds the event to your calendar.</p>
</body>
</html>
