# Active in every test (@ActiveProfiles("test")). The datasource comes from Testcontainers (@ServiceConnection).
spring:
  flyway:
    locations: classpath:db/migration   # schema + reference data only, no demo seed
  datasource:
    hikari:
      maximum-pool-size: 20             # the concurrency tests run 32 threads against one event

eureka:
  client:
    enabled: false

mitpass:
  security:
    load-balanced: false   # tests import TestSecurityConfig (in-memory key); nothing fetches a JWK set
  events:
    scheduler:
      enabled: false       # tests call EventLifecycleScheduler.runOnce(at) themselves
  messaging:
    relay:
      enabled: false       # outbox rows are written and asserted; only MessagingFlowTest sends them to RabbitMQ
    tap-queue:
      enabled: false

management:
  health:
    rabbit:
      enabled: false       # no broker in most tests
