server:
  port: 8082
  # Honour X-Forwarded-* from the gateway, so Location headers and springdoc server URLs point at :8080.
  forward-headers-strategy: framework

spring:
  application:
    name: event-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/event_db
    username: ${DB_USER:event_svc}
    password: ${DB_PASSWORD:event_svc}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only checks the mapping against it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # db/seed holds the repeatable demo data (R__demo_seed.sql); tests switch it off (application-test.yml).
    locations: classpath:db/migration,classpath:db/seed
  data:
    web:
      pageable:
        max-page-size: 100
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:mitpass}
    password: ${RABBITMQ_PASSWORD:mitpass}
    publisher-confirm-type: simple   # the outbox relay waits for the broker's confirms (D11)

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always   # names and status for the admin health page (D15); details stay hidden

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

mitpass:
  # Campus time zone: search dates (from/to) are calendar days here.
  time-zone: Asia/Kolkata
  security:
    # The catalogue is public to read (owner decision, docs/plans/phase-2.md §2); every write needs a token.
    public-paths:
      - GET /api/events
      - GET /api/events/{id}
      - GET /api/events/{id}/sessions
      - GET /api/events/{id}/sessions/**
      - GET /api/venues/**
      - GET /api/venues
      - GET /api/categories
  clients:
    # A Eureka service id, resolved by Spring Cloud LoadBalancer.
    auth-service: http://auth-service
  events:
    scheduler:
      # Time-based lifecycle moves (docs/DECISIONS.md D10): open/close registration, LIVE, COMPLETED.
      enabled: true
      interval: 30s
      doors-open-lead: 30m   # LIVE this long before startsAt, so early arrivals can check in
  idempotency:
    ttl: 24h                 # an Idempotency-Key replays its first result this long
    cleanup-interval: 1h
  messaging:
    # Transactional outbox → RabbitMQ (docs/DECISIONS.md D11; defaults in libs/common-messaging MessagingProperties).
    exchange: mitpass.events
    relay:
      poll-interval: 500ms
      batch-size: 100
      retention: 7d
    tap-queue:
      enabled: true          # dev only: see every event in the RabbitMQ UI before consumers exist (P4+)
      name: mitpass.events.tap
      max-length: 1000

logging:
  pattern:
    level: "%5p [%X{correlationId:-}] [%X{userId:-}]"
