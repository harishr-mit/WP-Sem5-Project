# Active in every test (@ActiveProfiles("test")). The datasource comes from Testcontainers (@ServiceConnection);
# the mail sender is replaced by CapturingMailSender (MailTestConfig).
spring:
  flyway:
    locations: classpath:db/migration   # schema + reference data only, no demo accounts

eureka:
  client:
    enabled: false

mitpass:
  messaging:
    relay:
      enabled: false   # outbox rows are written and asserted, never sent (no broker in these tests)

management:
  health:
    rabbit:
      enabled: false
